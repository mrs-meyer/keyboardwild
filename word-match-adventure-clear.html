const $=id=>document.getElementById(id);let deck=[],round=[],selected=null,done=0,matched=new Set(),cursor=0;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function speak(w){if(!('speechSynthesis'in window)){$('audioNote').hidden=false;return}const s=speechSynthesis;const voices=s.getVoices();const us=voices.filter(v=>v.lang.replace('_','-').toLowerCase()==='en-us');const voice=us.find(v=>/Google US English/i.test(v.name))||us.find(v=>/natural|neural|premium|enhanced/i.test(v.name))||us.find(v=>/Samantha|Aria|Jenny/i.test(v.name))||us[0];s.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))$('audioNote').hidden=false};s.speak(u)}
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
function start(){deck=shuffle(vocabulary);cursor=0;done=0;$('progress').max=deck.length;show()}
function update(){$('progress').value=done;$('count').textContent=done+' of '+deck.length+' words matched'}
function show(){selected=null;matched=new Set();$('next').hidden=true;$('message').textContent='';$('pictures').replaceChildren();$('words').replaceChildren();if(cursor>=deck.length){$('message').textContent='🎉 Amazing work! You matched every word!';$('next').textContent='Play again';$('next').hidden=false;return}round=deck.slice(cursor,cursor+3);if(round.length<3){round=round.concat(shuffle(deck.slice(0,cursor)).slice(0,3-round.length))}const targets=new Set(deck.slice(cursor,cursor+3).map(x=>x[0]));for(const [w,src] of shuffle(round)){const p=document.createElement('button');p.className='picture';p.dataset.word=w;p.setAttribute('aria-label','Picture choice');const img=new Image();img.src=src;img.alt='';p.append(img);p.onclick=()=>check(selected,w,p,targets);p.ondragover=e=>e.preventDefault();p.ondrop=e=>{e.preventDefault();check(e.dataTransfer.getData('text/plain'),w,p,targets)};$('pictures').append(p)}for(const [w] of shuffle(round)){const b=document.createElement('button');b.className='word';b.textContent='🔊 '+w;b.dataset.word=w;b.draggable=true;b.onclick=()=>choose(w);b.ondragstart=e=>{choose(w);e.dataTransfer.setData('text/plain',w);e.dataTransfer.effectAllowed='move'};$('words').append(b)}update()}
function choose(w){if(matched.has(w))return;selected=w;speak(w);document.querySelectorAll('.word').forEach(b=>b.classList.toggle('selected',b.dataset.word===w))}
function check(w,target,p,targets){if(!w||matched.has(w)||matched.has(target)||!round.some(x=>x[0]===w))return;if(w!==target){$('message').textContent='Try another picture. You can do it!';p.classList.add('wrong');setTimeout(()=>p.classList.remove('wrong'),500);return}matched.add(w);if(targets.has(w))done++;p.classList.add('correct');p.disabled=true;const label=document.createElement('span');label.className='answer';label.textContent='✓ '+w;p.append(label);document.querySelectorAll('.word').forEach(b=>{if(b.dataset.word===w){b.disabled=true;b.draggable=false}b.classList.remove('selected')});selected=null;$('message').textContent='⭐ Great job!';update();if(matched.size===round.length){cursor+=3;$('next').textContent=cursor>=deck.length?'Finish →':'Next pictures →';$('next').hidden=false}}
